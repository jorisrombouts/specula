name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: specula
          POSTGRES_PASSWORD: specula
          POSTGRES_DB: specula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specula -d specula"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy .
      # Mirror db/init.sql: pre-create the (untrusted) vector extension and a
      # non-superuser app role that owns the schema, so RLS/FORCE is actually
      # enforced under pytest (the superuser bootstrap role would bypass every
      # policy and make the tenancy tests hollow). Connect pytest as specula_app.
      - name: Provision non-superuser app role + extensions
        run: |
          PGPASSWORD=specula psql -h localhost -p 5432 -U specula -d specula -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE ROLE specula_app LOGIN PASSWORD 'specula' NOSUPERUSER NOBYPASSRLS;
          GRANT CONNECT ON DATABASE specula TO specula_app;
          GRANT CREATE, USAGE ON SCHEMA public TO specula_app;
          SQL
      # Mirror `just db-bootstrap`: migrate then seed as specula_app, so read-model
      # tests (lens counts, insights aggregates) have the demo pool to assert against
      # — matching the local per-worktree DB setup. Without seeding, tests that read
      # the demo user fail only in CI.
      - name: Migrate + seed (as specula_app)
        run: |
          uv run alembic upgrade head
          uv run python -m specula_api.seed
        env:
          DATABASE_URL: postgresql+asyncpg://specula_app:specula@localhost:5432/specula
      - run: uv run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://specula_app:specula@localhost:5432/specula

  web:
    runs-on: ubuntu-latest
    # The E2E + visual suites now drive the API-backed app: Playwright starts a
    # uvicorn (see playwright*.config.ts) that serves the seeded demo data. So this
    # job needs Postgres + the api toolchain, seeded, before those steps run.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: specula
          POSTGRES_PASSWORD: specula
          POSTGRES_DB: specula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specula -d specula"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-dummy-secret-not-for-production
      # The harness's uvicorn connects here (as specula_app, on the CI Postgres);
      # Playwright reads this at config load and passes it to the uvicorn it starts.
      E2E_DATABASE_URL: postgresql+asyncpg://specula_app:specula@localhost:5432/specula
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      # pnpm version is read from the root package.json "packageManager" field
      # (do not also set `version:` here — the action errors on a dual source).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      # API toolchain for the uvicorn the Playwright suites start.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: apps/api
      # Mirror db/init.sql + just db-bootstrap: non-superuser app role + extensions,
      # then migrate + seed as specula_app so the API serves the seeded demo dataset.
      - name: Provision app role + extensions, migrate + seed
        working-directory: apps/api
        run: |
          PGPASSWORD=specula psql -h localhost -p 5432 -U specula -d specula -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE ROLE specula_app LOGIN PASSWORD 'specula' NOSUPERUSER NOBYPASSRLS;
          GRANT CONNECT ON DATABASE specula TO specula_app;
          GRANT CREATE, USAGE ON SCHEMA public TO specula_app;
          SQL
          uv run alembic upgrade head
          uv run python -m specula_api.seed
        env:
          DATABASE_URL: postgresql+asyncpg://specula_app:specula@localhost:5432/specula
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The E2E suite triggers a run + mutates the demo user's data (latest run,
      # approvals). Reseed so the visual suite captures the deterministic seeded
      # state (sidebar "synced Nd ago · 7 new"), not whatever E2E left behind.
      - name: Reseed before visual
        working-directory: apps/api
        run: uv run python -m specula_api.seed
        env:
          DATABASE_URL: postgresql+asyncpg://specula_app:specula@localhost:5432/specula
      # Pixel regression against the API-backed production build (own config, own
      # servers — a uvicorn + a next start). Committed Linux baselines are generated
      # by `just visual-update` (same Chromium + font stack + seeded data).
      - run: pnpm exec playwright test --config playwright.visual.config.ts --update-snapshots=all
      - name: Upload regenerated visual baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-visual-baselines
          path: apps/web/e2e/visual/**/*-linux.png
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
