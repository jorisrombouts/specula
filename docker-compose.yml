services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: specula
      POSTGRES_PASSWORD: specula
      POSTGRES_DB: specula
    # Host port 55432 (not the default 5432) so Specula's dev DB never collides with a
    # system/Homebrew Postgres bound to loopback :5432 — which would silently shadow
    # this pgvector container. Container port stays 5432; DATABASE_URL uses 55432.
    ports:
      - "55432:5432"
    volumes:
      - specula_pgdata:/var/lib/postgresql/data
      # Runs once on a fresh volume: pre-creates extensions and downgrades the
      # `specula` role to non-superuser so RLS/FORCE is actually enforced locally
      # (superusers bypass RLS). See db/init.sql.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specula -d specula"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  specula_pgdata:
