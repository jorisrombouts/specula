services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: specula
      POSTGRES_PASSWORD: specula
      POSTGRES_DB: specula
    ports:
      - "5432:5432"
    volumes:
      - specula_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specula -d specula"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  specula_pgdata:
